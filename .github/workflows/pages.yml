name: Publish Care4Gardens on MCC Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -r requirements.txt
      - name: Install video validation tools
        timeout-minutes: 5
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            ffmpeg -version | head -n 1
          else
            # The runner's Azure mirror can stall on codec downloads. Use the
            # signed Ubuntu archives directly, keeping package verification on.
            printf '%s\n' \
              'deb https://archive.ubuntu.com/ubuntu noble main universe' \
              'deb https://archive.ubuntu.com/ubuntu noble-updates main universe' \
              'deb https://security.ubuntu.com/ubuntu noble-security main universe' \
              > "$RUNNER_TEMP/care4gardens-ubuntu.list"
            apt_options=(-o "Dir::Etc::sourcelist=$RUNNER_TEMP/care4gardens-ubuntu.list" -o "Dir::Etc::sourceparts=-" -o Acquire::Retries=1 -o Acquire::https::Timeout=30)
            sudo apt-get "${apt_options[@]}" update -qq
            sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg
          fi
      - run: npm run build
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
